<title>Galaxia para Joel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Dancing+Script:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Layout: foto real del espacio de fondo, escena WebGL encima; HUD tipo cabina en las esquinas */
:root{
  --void:#03040c;
  --ink:#ece8ff;
  --dim:#9a9fcc;
  --nova:#ffd2a1;
  --nebula:#9b7bff;
  --ion:#66e3ff;
  --serif:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --star:polygon(50% 0%,66.46% 27.35%,97.55% 34.55%,76.63% 58.65%,79.39% 90.45%,50% 78%,20.61% 90.45%,23.37% 58.65%,2.45% 34.55%,33.54% 27.35%);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:-6%;background:var(--void) url("fotos/fondo.jpg") center/cover no-repeat;z-index:0;will-change:transform}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(3,4,12,.15) 0%,rgba(3,4,12,.55) 75%,rgba(3,4,12,.8) 100%)}
#scene,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{z-index:1;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#fx{pointer-events:none;z-index:2}

.hud{position:fixed;left:0;right:0;padding-inline:20px;z-index:5;pointer-events:none}
#top{top:calc(env(safe-area-inset-top,0px) + 30px);text-align:center}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ion);opacity:.9}
h1{font:italic 500 clamp(2.3rem,6.6vw,4.6rem)/1 var(--serif);margin:.32em 0 .14em;text-wrap:balance;text-shadow:0 0 28px rgba(155,123,255,.7),0 2px 10px rgba(0,0,0,.6)}
.name{font:500 clamp(1rem,2.4vw,1.35rem)/1.25 var(--serif);color:var(--nova);letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.7)}

#bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.readout{font:400 12px/1.8 var(--mono);color:#c4c8ee;letter-spacing:.05em;font-variant-numeric:tabular-nums;min-width:0;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.readout b{color:var(--ink);font-weight:500}
.controls{display:flex;gap:10px;pointer-events:auto;flex-shrink:0}
.btn{width:50px;height:50px;border-radius:50%;border:1px solid rgba(102,227,255,.35);background:rgba(10,14,40,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--ion);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--ion);outline-offset:3px}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#msgBtn{border-color:rgba(255,210,161,.5);box-shadow:0 0 22px rgba(155,123,255,.45)}

/* Botón grande de la carta, centrado sobre el pie */
#letterBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:6;border:0;background:none;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity 1.2s ease}
#letterBtn.show{opacity:1;pointer-events:auto}
#letterBtn:focus-visible{outline:2px solid var(--ion);outline-offset:4px;border-radius:12px}
.env{position:relative;width:74px;height:50px;border-radius:5px;background:linear-gradient(160deg,#fff4e2,#f3d9b5);box-shadow:0 0 28px rgba(255,170,200,.7),0 6px 16px rgba(0,0,0,.45);animation:pulse 2.2s ease-in-out infinite}
.env::before{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(to top right,transparent 49%,rgba(190,140,110,.45) 50%,transparent 52%),linear-gradient(to top left,transparent 49%,rgba(190,140,110,.45) 50%,transparent 52%)}
.env::after{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(170deg,#ffe9cc,#ecc79c);clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;left:50%;top:20px;width:22px;height:22px;margin-left:-11px;z-index:1;color:#d23b5e;font-size:22px;line-height:22px;text-align:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.env-label{font:600 1.35rem/1 'Dancing Script',cursive;color:#ffe3ef;text-shadow:0 0 12px rgba(255,120,180,.9),0 2px 6px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.06)}}

#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);text-align:center;font:400 11px/1.5 var(--mono);letter-spacing:.12em;color:var(--ink);z-index:5;pointer-events:none;opacity:0;transition:opacity 1s ease;padding-inline:20px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
#hint.show{opacity:.9}

#launch{position:fixed;inset:0;z-index:20;width:100%;border:0;margin:0;padding:24px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:radial-gradient(ellipse at center,rgba(3,4,12,.3) 0%,rgba(3,4,12,.88) 70%);transition:opacity .9s ease}
#launch.gone{opacity:0;pointer-events:none}
#launch:focus-visible{outline:none}
#launch:focus-visible .launch-label{text-decoration:underline;text-underline-offset:6px}
.orb{position:relative;width:150px;height:110px;animation:bob 4s ease-in-out infinite}
.orb::before{content:"";position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#e3d8ff 0%,#8e7bff 38%,#2c237a 78%,#120f33 100%);box-shadow:0 0 40px rgba(155,123,255,.55)}
.orb::after{content:"";position:absolute;left:50%;top:50%;width:140px;height:34px;margin:-17px 0 0 -70px;border-radius:50%;border:2px solid rgba(102,227,255,.75);border-top-color:transparent;transform:rotate(-16deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.launch-label{font:italic 500 clamp(1.8rem,5.4vw,2.6rem)/1 var(--serif)}
.launch-sub{font:400 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ion);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
#count{font:500 clamp(4.5rem,20vw,9rem)/1 var(--mono);color:var(--nova);text-shadow:0 0 30px rgba(255,210,161,.6)}

/* Capas emergentes: mensaje, galería y foto ampliada */
.layer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(3,4,12,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.layer.open{opacity:1;visibility:visible}
.close{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;color:var(--dim);font:400 24px/1 var(--mono);cursor:pointer;border-radius:50%;z-index:2}
.close:hover{color:var(--ink)}
.close:focus-visible{outline:2px solid var(--ion)}

.card{position:relative;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;padding:44px 34px 34px;border-radius:6px;background:linear-gradient(170deg,rgba(24,20,64,.97),rgba(6,8,22,.98));border:1px solid rgba(155,123,255,.35);box-shadow:0 0 60px rgba(155,123,255,.25);transform:translateY(16px);transition:transform .45s ease}
.layer.open .card{transform:none}
.card .eyebrow{display:block;margin-bottom:14px}
.card h2{font:italic 500 2.2rem/1.05 var(--serif);margin:0 0 22px;color:var(--nova);text-wrap:balance}
.card p{font:400 1.22rem/1.65 var(--serif);margin:0 0 14px;color:var(--ink)}
.card .sign{margin-top:22px;font:400 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* La carta: papel crema con renglones y letra cursiva */
.card.letter{max-width:600px;padding:52px 40px 40px;border-radius:4px;border:0;color:#3b2547;
  background:repeating-linear-gradient(to bottom,transparent 0 39px,rgba(120,140,200,.22) 39px 40px),radial-gradient(ellipse at 30% 20%,#fffaf0,#f6e8cf 80%,#ecd7b4);
  box-shadow:0 0 70px rgba(255,170,200,.35),0 20px 50px rgba(0,0,0,.55)}
.letter .close{color:#8a6a7a}.letter .close:hover{color:#3b2547}
.letter h2{font:400 3rem/1 'Great Vibes',cursive;color:#a8244a;margin:0 0 20px}
.letter p{font:500 1.5rem/40px 'Dancing Script',cursive;color:#3b2547;margin:0 0 14px;text-wrap:pretty}
.letter blockquote{margin:6px 0 18px;padding:4px 0 4px 18px;border-left:2px solid rgba(168,36,74,.45)}
.letter blockquote p{font-size:1.4rem;color:#6a2a48;margin:0}
.letter blockquote cite{display:block;font:600 1.15rem/32px 'Dancing Script',cursive;color:#a8244a;font-style:normal}
.letter .firma{margin-top:18px;text-align:right;font:400 2.8rem/1.1 'Great Vibes',cursive;color:#a8244a}

#gallery{align-items:stretch}
.gal-inner{width:100%;max-width:980px;overflow-y:auto;padding-block:36px 24px;display:flex;flex-direction:column;gap:24px}
.gal-head{text-align:center}
.gal-head h2{font:italic 500 clamp(2rem,5vw,2.8rem)/1 var(--serif);margin:.3em 0 0;color:var(--nova)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}
.tile{border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);font:400 10px/1 var(--mono);letter-spacing:.15em}
.tile .glow{width:100%;max-width:170px;filter:drop-shadow(0 0 10px rgba(255,210,161,.45));transition:transform .25s ease,filter .25s ease}
.tile:hover .glow,.tile:focus-visible .glow{transform:scale(1.06) rotate(-4deg);filter:drop-shadow(0 0 16px rgba(255,210,161,.8))}
.tile:focus-visible{outline:none;color:var(--ion)}
.tile .rim{display:block;aspect-ratio:1;clip-path:var(--star);background:linear-gradient(160deg,#fff1dc,#ffd2a1 40%,#b59bff);padding:6%}
.tile img{display:block;width:100%;height:100%;object-fit:cover;clip-path:var(--star)}

#viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
#viewer img{display:block;max-width:min(92vw,900px);max-height:74vh;border-radius:4px;border:1px solid rgba(255,210,161,.5);box-shadow:0 0 50px rgba(155,123,255,.4);transform:scale(.96);transition:transform .4s ease}
#viewer.open img{transform:none}
#viewer figcaption{font:400 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim);font-variant-numeric:tabular-nums}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(102,227,255,.35);background:rgba(10,14,40,.7);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:2}
.nav:hover{border-color:var(--ion)}
.nav:focus-visible{outline:2px solid var(--ion);outline-offset:3px}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#prev{left:12px}#next{right:12px}

@media (max-width:560px){
  #top{top:calc(env(safe-area-inset-top,0px) + 20px)}
  .hide-sm{display:none}
  .card{padding:40px 22px 26px}
  .card p{font-size:1.1rem}
  .letter p{font-size:1.3rem;line-height:36px}
  .card.letter{padding:48px 22px 30px;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(120,140,200,.22) 35px 36px),radial-gradient(ellipse at 30% 20%,#fffaf0,#f6e8cf 80%,#ecd7b4)}
  .letter h2{font-size:2.6rem}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px 8px}
  .nav{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:none}
  #viewer img{max-height:66vh}
}
@media (prefers-reduced-motion:reduce){
  .orb,.launch-sub,.env{animation:none}
}
</style>

<div id="sky" aria-hidden="true"></div>
<canvas id="scene" aria-label="Galaxia en 3D con fotos en marcos de estrella y frases que giran"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hud" id="top">
  <div class="eyebrow">Misión J · 02·2018 → ∞</div>
  <h1 id="title">Feliz día, mi amor</h1>
  <div class="name" id="name">Joel Marcos Acho Huanca</div>
</header>

<div id="hint">Arrastra para girar · toca una estrella para ver la foto</div>

<footer class="hud" id="bottom">
  <div class="readout">
    <div>Distancia entre nosotros <b>0,00 años luz</b></div>
    <div class="hide-sm">Despegue <b>02·2018</b> · Destino <b>siempre</b></div>
    <div>Días de viaje <b id="days">—</b> · Recuerdos <b id="nPhotos">—</b></div>
  </div>
  <div class="controls">
    <button class="btn" id="soundBtn" type="button" aria-label="Silenciar música" aria-pressed="true">
      <svg viewBox="0 0 24 24" id="soundIcon"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="btn" id="galBtn" type="button" aria-label="Ver todas las fotos">
      <svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6-4.5-4.1 6-.7z"/></svg>
    </button>
    <button class="btn" id="msgBtn" type="button" aria-label="Abrir mensaje">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </button>
  </div>
</footer>

<button id="launch" type="button">
  <span class="orb" aria-hidden="true"></span>
  <span class="launch-label" id="launchLabel">Toca para despegar</span>
  <span class="launch-sub" id="launchSub">Viaje con destino a ti</span>
  <span id="count" hidden></span>
</button>

<button id="letterBtn" type="button" aria-label="Abrir la carta">
  <span class="env" aria-hidden="true"><span class="seal">❤</span></span>
  <span class="env-label">Aprieta aquí</span>
</button>

<div class="layer" id="msg" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
  <div class="card letter">
    <button class="close" id="msgClose" type="button" aria-label="Cerrar carta">×</button>
    <h2 id="msgTitle">Amor mío,</h2>
    <div id="msgBody"></div>
    <div class="firma" id="msgSign"></div>
  </div>
</div>

<div class="layer" id="gallery" role="dialog" aria-modal="true" aria-labelledby="galTitle">
  <button class="close" id="galClose" type="button" aria-label="Cerrar galería">×</button>
  <div class="gal-inner">
    <div class="gal-head">
      <div class="eyebrow">Constelación de recuerdos</div>
      <h2 id="galTitle">Nuestras estrellas</h2>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="layer" id="viewer" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="close" id="viewClose" type="button" aria-label="Cerrar foto">×</button>
  <button class="nav" id="prev" type="button" aria-label="Foto anterior"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <figure>
    <img id="viewImg" alt="">
    <figcaption id="viewCap"></figcaption>
  </figure>
  <button class="nav" id="next" type="button" aria-label="Foto siguiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ======== Personaliza aquí ========
const CONFIG={
  titulo:"Feliz día, mi amor",
  nombre:"Joel Marcos Acho Huanca",
  inicio:"2018-02-01", // fecha en que empezó todo (AAAA-MM-DD)
  // Canción propia: pon un .mp3 en la carpeta y escribe su nombre, p. ej. "musica.mp3".
  // Si se deja vacío (o no se encuentra el archivo) suena la música ambiental generada.
  musica:"fotos/emanorados.mp3",
  // fx / fy: punto de la foto que queda al centro de la estrella (0 = izquierda/arriba, 1 = derecha/abajo)
  fotos:[
    {src:"fotos/foto01.jpg",fx:.5,fy:.22},{src:"fotos/foto02.jpg",fx:.5,fy:.5},{src:"fotos/foto03.jpg",fx:.42,fy:.45},
    {src:"fotos/foto04.jpg",fx:.5,fy:.28},{src:"fotos/foto05.jpg",fx:.5,fy:.18},{src:"fotos/foto06.jpg",fx:.5,fy:.3},
    {src:"fotos/foto07.jpg",fx:.3,fy:.45},{src:"fotos/foto08.jpg",fx:.5,fy:.3},{src:"fotos/foto09.jpg",fx:.5,fy:.45},
    {src:"fotos/foto10.jpg",fx:.5,fy:.35},{src:"fotos/foto11.jpg",fx:.5,fy:.42},{src:"fotos/foto12.jpg",fx:.5,fy:.38},
    {src:"fotos/foto13.jpg",fx:.5,fy:.5},{src:"fotos/foto14.jpg",fx:.5,fy:.5},{src:"fotos/foto15.jpg",fx:.5,fy:.4},
    {src:"fotos/foto16.jpg",fx:.5,fy:.45},{src:"fotos/foto17.jpg",fx:.5,fy:.33},{src:"fotos/foto18.jpg",fx:.5,fy:.45}
  ],
  frases:[
    "Dios, tú y yo","Todo comenzó aquella noche · 02-2018","Te amo","Eres mi estrella favorita",
    "Contigo el universo se queda corto","Gracias por ser tú","Mi lugar favorito del universo eres tú",
    "Que el Señor nos cuide en cada viaje","Tu risa ilumina mis días","Te quiero más que estrellas hay",
    "Contigo siempre a mil por hora","Gracias por los abrazos que me das","Eres mi órbita",
    "Aquí siempre tienes un lugar","Feliz día, pienso en ti","Contigo todo brilla"
  ],
  // La carta: los párrafos se separan con una línea en blanco (\n\n).
  // Un párrafo que empieza con « se muestra como cita; lo que va después de " — " es la referencia.
  mensaje:"Nos conocimos una noche en la que el Señor nos regaló la oportunidad de encontrarnos.\n\nHoy amanece un nuevo día, y no cualquiera: hoy es el Día del Hombre. Sé que tu carga es grande, pero también sé que tus fuerzas vienen del Señor, nuestro Padre Dios, quien creó a alguien tan increíble como tú.\n\nDe verdad, estoy muy agradecida por tu vida. Eres quien hace latir mi corazoncito y quien me hace sonrojar.\n\n«Cual manzano entre los árboles del bosque es mi amado entre los hombres. Me encanta sentarme a su sombra; dulce a mi paladar es su fruto.» — Cantares 2:3\n\nQuiero que siempre confiemos en el Señor.",
  firma:"Te amo ♥"
};
// ==================================

const FOTOS=CONFIG.fotos;
document.getElementById('title').textContent=CONFIG.titulo;
document.getElementById('name').textContent=CONFIG.nombre;
document.getElementById('nPhotos').textContent=FOTOS.length;
(function(){
  const start=new Date(CONFIG.inicio+'T00:00:00');
  const d=Math.floor((Date.now()-start.getTime())/86400000);
  document.getElementById('days').textContent=isFinite(d)?d.toLocaleString('es'):'—';
})();
const msgBody=document.getElementById('msgBody');
CONFIG.mensaje.split(/\n\s*\n/).forEach(t=>{
  t=t.trim();const p=document.createElement('p');
  if(t.startsWith('«')){
    const [q,ref]=t.split(' — ');
    const bq=document.createElement('blockquote');p.textContent=q;bq.appendChild(p);
    if(ref){const c=document.createElement('cite');c.textContent=ref;bq.appendChild(c);}
    msgBody.appendChild(bq);
  }else{p.textContent=t;msgBody.appendChild(p);}
});
document.getElementById('msgSign').textContent=CONFIG.firma||'';

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const small=()=>innerWidth<640;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

// ---------- Escena (fondo transparente: se ve la foto del espacio detrás) ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,9000);
const sky=document.getElementById('sky');

function dotTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
function glowTexture(c1,c2,a=1){
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);

      fctx.beginPath();fctx.moveTo(cx+Math.cos(s.a)*r1,cy+Math.sin(s.a)*r1);fctx.lineTo(cx+Math.cos(s.a)*r2,cy+Math.sin(s.a)*r2);fctx.stroke();

    if(k>=1){meteors.splice(i,1);continue;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    const a=Math.sin(k*Math.PI),sp=Math.hypot(m.vx,m.vy);
    const tx=m.x-m.vx/sp*m.len,ty=m.y-m.vy/sp*m.len;

function startPad(){
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){return;}
  master=actx.createGain();master.gain.value=0;
  const filter=actx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=950;
  const delay=actx.createDelay(2);delay.delayTime.value=.6;
  const fb=actx.createGain();fb.gain.value=.38;
  filter.connect(master);filter.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(master);
  master.connect(actx.destination);
  [110,164.81,220,277.18,329.63,415.3].forEach((f,i)=>{
    const o=actx.createOscillator();o.type=i%2?'sine':'triangle';o.frequency.value=f;o.detune.value=(Math.random()-.5)*10;
    const g=actx.createGain();g.gain.value=.055;
    const lfo=actx.createOscillator();lfo.frequency.value=.04+Math.random()*.08;
    const lg=actx.createGain();lg.gain.value=.045;
    lfo.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(filter);o.start();lfo.start();
  });
  master.gain.linearRampToValueAtTime(.5,actx.currentTime+4);
  const notes=[880,987.77,1108.73,1318.51,1479.98];
  (function chime(){
    if(soundOn&&actx.state==='running'){
      const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
      o.type='sine';o.frequency.value=notes[(Math.random()*notes.length)|0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);
      o.connect(g);g.connect(filter);o.start(t);o.stop(t+2.5);
    }

  })();
}

const msgL=makeLayer('msg','msgClose','msgBtn');
document.getElementById('letterBtn').addEventListener('click',msgL.open);
const galL=makeLayer('gallery','galClose','galBtn');
const viewL=makeLayer('viewer','viewClose');

const grid=document.getElementById('grid');
FOTOS.forEach((f,i)=>{
  const b=document.createElement('button');b.type='button';b.className='tile';
  b.setAttribute('aria-label',`Ver foto ${i+1}`);
  b.innerHTML=`<span class="glow"><span class="rim"><img alt="" loading="lazy"></span></span><span>${String(i+1).padStart(2,'0')}</span>`;
  const im=b.querySelector('img');im.src=f.src;im.style.objectPosition=`${f.fx*100}% ${f.fy*100}%`;
  b.addEventListener('click',()=>openViewer(i));
  grid.appendChild(b);
});

let current=0;
const viewImg=document.getElementById('viewImg'),viewCap=document.getElementById('viewCap');
function showPhoto(i){
  current=(i+FOTOS.length)%FOTOS.length;
  viewImg.src=FOTOS[current].src;
  viewImg.alt=`Foto ${current+1} de ${FOTOS.length}`;
  viewCap.textContent=`Estrella ${String(current+1).padStart(2,'0')} de ${FOTOS.length}`;
}
function openViewer(i){showPhoto(i);if(!viewL.isOpen())viewL.open();}
document.getElementById('prev').addEventListener('click',()=>showPhoto(current-1));
document.getElementById('next').addEventListener('click',()=>showPhoto(current+1));
addEventListener('keydown',e=>{
  if(viewL.isOpen()){
    if(e.key==='ArrowLeft')showPhoto(current-1);
    if(e.key==='ArrowRight')showPhoto(current+1);
  }
  if(e.key==='Escape'){const top=[...layers].reverse().find(l=>l.isOpen());if(top)top.close();}
});
// Deslizar con el dedo en la foto ampliada
let swipeX=null;
viewImg.addEventListener('touchstart',e=>{swipeX=e.touches[0].clientX;},{passive:true});
viewImg.addEventListener('touchend',e=>{
  if(swipeX===null)return;const dx=e.changedTouches[0].clientX-swipeX;swipeX=null;
  if(Math.abs(dx)>40)showPhoto(current+(dx<0?1:-1));
},{passive:true});

// ---------- Despegue ----------
const launch=document.getElementById('launch'),count=document.getElementById('count'),hint=document.getElementById('hint');
launch.addEventListener('click',()=>{
  if(launch.dataset.busy)return;launch.dataset.busy='1';
  startMusic();
  const go=()=>{
    launch.classList.add('gone');
    flight={start:performance.now(),dur:reduced?1200:3800,from:dist};
    launched=true;
    setTimeout(()=>document.getElementById('letterBtn').classList.add('show'),reduced?600:3200);
    setTimeout(()=>hint.classList.add('show'),2500);
    setTimeout(()=>hint.classList.remove('show'),10000);
  };
  if(reduced){go();return;}
  document.getElementById('launchLabel').hidden=true;
  document.getElementById('launchSub').hidden=true;
  count.hidden=false;
  let n=3;count.textContent=n;
  const iv=setInterval(()=>{n--;if(n>0)count.textContent=n;else{clearInterval(iv);go();}},750);
});

// ---------- Animación ----------
const clock=new THREE.Clock();let time=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);time+=dt;
  if(flight){
    const p=Math.min((performance.now()-flight.start)/flight.dur,1);
    dist=lerp(flight.from,tDist,ease(p));
    warp=reduced?0:Math.sin(p*Math.PI)*(1-p*.4);
    if(p>=1){flight=null;warp=0;heartTarget=1;}
  }else dist+=(tDist-dist)*.06;
  if(!pointers.size){
    velX*=.9;velY*=.9;
    tRotX=clamp(tRotX+velX,-1.2,1.2);tRotY+=velY+(launched?(reduced?.0002:.0007):0);
  }
  rotX+=(tRotX-rotX)*.12;rotY+=(tRotY-rotY)*.12;

  const spin=reduced?.3:1;
  galaxy.rotation.y+=dt*.035*spin;
  photoRing.rotation.y-=dt*.03*spin;
  orbit.rotation.y+=dt*.05*spin;
  planet.rotation.y+=dt*.25*spin;
  moonPivot.rotation.y+=dt*.6*spin;
  starsA.opacity=.75+.25*Math.sin(time*1.3);
  starsB.opacity=.55+.45*Math.sin(time*.9+1.7);
  phrases.forEach(s=>{s.material.opacity=.88+.12*Math.sin(time*1.4+s.userData.phase);});
  photoSprites.forEach(s=>{
    const u=s.userData;
    if(u.ready)s.material.opacity+=(1-s.material.opacity)*.04;
    s.position.y=u.baseY+Math.sin(time*.8+u.phase)*6*spin;
    s.material.rotation=Math.sin(time*.5+u.phase)*.08*spin;
  });
  heartLineMat.opacity+=(heartTarget*.45-heartLineMat.opacity)*.02;
  heartStarMat.opacity+=(heartTarget-heartStarMat.opacity)*.02;

  const cx=Math.cos(rotX);
  camera.position.set(dist*Math.sin(rotY)*cx,dist*Math.sin(rotX),dist*Math.cos(rotY)*cx);
  camera.lookAt(0,0,0);
  heart.lookAt(camera.position);
  renderer.render(scene,camera);

  // La foto de fondo se mueve un poco con la cámara para dar profundidad
  const zoom=1+clamp((1700-dist)/1700,0,1)*.08;
  sky.style.transform=`translate3d(${Math.sin(rotY)*-28}px,${(rotX-.42)*40}px,0) scale(${zoom})`;
  drawFx(dt);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);sizeFx();
});
</script>
